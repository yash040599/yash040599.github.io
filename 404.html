<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Rupevo</title></head>
<body><h1>Rupevo has moved</h1><p id="status">Checking the main website…</p>
<p><a id="primary" href="https://rupevo.in/">Open rupevo.in</a></p>
<p><a id="fallback" href="https://rupevo.yash040599.workers.dev/">Open alternate website</a></p>
<script>
(async () => {
  const root = '/Rupevo';
  const path = location.pathname;
  if (path !== '/' && path !== root && !path.startsWith(root + '/')) return;
  const suffix = (path === '/' ? '/' : path.slice(root.length) || '/') + location.search + location.hash;
  const primary = 'https://rupevo.in';
  const fallback = 'https://rupevo.yash040599.workers.dev';
  document.getElementById('primary').href = primary + suffix;
  document.getElementById('fallback').href = fallback + suffix;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  let destination = fallback;
  try {
    const response = await fetch(primary + '/health.json', {signal: controller.signal, cache: 'no-store', credentials: 'omit'});
    if (!response.ok) throw new Error('Unavailable');
    const health = await response.json();
    if (health.site === 'rupevo' && health.status === 'ok') destination = primary;
  } catch (_) { /* DNS, TLS, timeout or failed response: use alternate host. */ }
  finally { clearTimeout(timer); }
  document.getElementById('status').textContent = 'Opening the website…';
  location.replace(destination + suffix);
})();
</script></body></html>
